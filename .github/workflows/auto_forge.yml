name: 👻 The Ghost Protocol (Forge Fyers Token)

on:
  schedule:
    # Runs at 03:00 UTC (08:30 AM IST) Every Monday to Friday
    # - cron: '0 3 * * 1-5'
  workflow_dispatch: # Allows manual trigger for testing!

jobs:
  run-phantom:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📦 Install Phantom Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fyers-apiv3==3.0.4 psycopg2-binary pyotp playwright
          # Install Playwright Chromium Headless Browser
          playwright install chromium
          
      - name: 🤖 Execute The Phantom
        env:
          NEON_PASSWORD: ${{ secrets.NEON_PASSWORD }}
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_PHONE: ${{ secrets.FYERS_PHONE }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_TOTP_SECRET: ${{ secrets.FYERS_TOTP_SECRET }}
        run: python -u fyers_auto_forge.py

      - name: 📸 Rescue Crime Scene Photo
        if: failure() 
        uses: actions/upload-artifact@v4
        with:
          name: phantom-crime-scene
          path: crime_scene.png
