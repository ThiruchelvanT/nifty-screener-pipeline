name: 🏛️ EOD Master Pipeline

on:
  workflow_dispatch: 
jobs:
  run-daily-engine:
    runs-on: ubuntu-latest 
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17 (Required for PySpark)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📥 Download Postgres JDBC Driver
        run: |
          mkdir -p jars
          wget https://jdbc.postgresql.org/download/postgresql-42.7.11.jar -O jars/postgresql-42.7.11.jar
          
      - name: 📦 Install Data Engineering Stack
        run: |
          python -m pip install --upgrade pip
          pip install pyspark==3.5.1 numpy==1.26.4 pandas==2.1.4 pyarrow==14.0.1 psycopg2-binary yfinance sqlalchemy requests psutil fyers-apiv3==3.0.4
          pip install git+https://github.com/MerlinR/Pandas-ta-fork.git

      # ==========================================
      # THE SEQUENTIAL EXECUTION CHAIN
      # ==========================================
      - name:  Run EOD Bronze Ingestion
        env:
          NEON_PASSWORD: ${{ secrets.NEON_PASSWORD }}
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}      
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}    
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }} 
        run: python -u bronze_ingestion.py
          
      # - name: 2️⃣ Execute Silver Layer Transformation
      #   env:
      #     NEON_PASSWORD: ${{ secrets.NEON_PASSWORD }}
      #   run: python -u spark_silver_layer.py

      - name:  Run Macro Healer (Cleanup & Validation)
        env:
          NEON_PASSWORD: ${{ secrets.NEON_PASSWORD }}
        run: python -u eod_healer.py
