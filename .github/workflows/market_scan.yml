name: Daily Nifty 500 Scan

on:
  schedule:
    # - cron: '30 10 * * 1-5' # Runs at 4:00 PM IST (10:30 UTC) Mon-Fri
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:      
      - name: Checkout Code        
        uses: actions/checkout@v4      
      
      - name: Build Docker Container
        run: docker build -t nifty-oracle-scraper .
      
      - name: Run Containerized ETL Pipeline        
        env:          
          NEON_PASSWORD: ${{ secrets.NEON_PASSWORD }}        
        # The --rm flag tells Docker to destroy the container immediately after it finishes running
        run: docker run --rm -e NEON_PASSWORD nifty-oracle-scraper
