name: 🕰️ One-Time Historical Backfill

# The 'workflow_dispatch' trigger means this will ONLY run when you manually click the button in GitHub
on:
  workflow_dispatch:

jobs:
  run-backfill:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Data Engineering Stack
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas sqlalchemy psycopg2-binary

      - name: 🚀 Execute Backfill Script
        env:
          # This securely pulls your Neon password from GitHub Secrets
          NEON_PASSWORD: ${{ secrets.NEON_PASSWORD }}
        run: python bronze_backfill.py
