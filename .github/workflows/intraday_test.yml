name: ⚡ Intraday Bronze Feeder

on:
  workflow_dispatch: 
  repository_dispatch:
    types: [trigger-sniper] # Driven by cron-job.org webhook

jobs:
  run-intraday-ingestion:
    runs-on: ubuntu-latest 
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4
          
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📦 Install Lightweight Stack
        run: |
          python -m pip install --upgrade pip
          # ⚡ STRIPPED DOWN: No PySpark, No Java needed for simple ingestion
          pip install pandas==2.1.4 psycopg2-binary yfinance sqlalchemy requests fyers-apiv3==3.0.4
          
      - name: 📡 Run Guerrilla Bronze Ingestion (15m)
        env:
          NEON_PASSWORD: ${{ secrets.NEON_PASSWORD }}
        run: python -u bronze_ingestion.py --intraday

      - name: 🚀 Signal AWS Sniper
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Invoke AWS Lambda
        run: |
          aws lambda invoke \
            --function-name IntradaySniperEngine \
            --invocation-type Event \
            response.json
