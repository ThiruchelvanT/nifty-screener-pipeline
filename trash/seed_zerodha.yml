name: 🚀 Manual Zerodha Bronze Seed

on:
  workflow_dispatch: # This creates a "Run workflow" button in GitHub

jobs:
  inject-zerodha-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Use your project's version

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas sqlalchemy psycopg2-binary

      - name: ⚙️ Execute Seed Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python seed_bronze_zerodha.py
